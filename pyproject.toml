[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nuevamente"
version = "1.4.0"
description = "Sistema Inteligente de Adaptacion y Generacion de Contenido Educativo (Hackathon ONE G10 - Kairos G10)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "fastapi",
    "uvicorn[standard]",
    "numpy",
    "scikit-learn",
    "pypdf",
    "python-multipart",
    "python-dotenv",
    "pillow",
    "imageio-ffmpeg",
    "python-pptx",
    "python-docx",
    "langgraph>=1.0",
    "fpdf2",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
oci = ["oci"]
gemini = ["google-genai>=1.30"]
claude = ["anthropic>=1"]
ui = ["streamlit"]
# ChromaDB como vector store (VECTOR_STORE=chroma). En Python 3.14 aún no hay onnxruntime:
# ahí instalar con `pip install --no-deps chromadb` y sus dependencias (ver README).
chroma = ["chromadb>=1.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nuevamente = ["web/*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nuevamente"
version = "0.1.0"
description = "Sistema Inteligente de Adaptacion y Generacion de Contenido Educativo (Hackathon ONE G10 - Kairos G10)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "fastapi",
    "uvicorn[standard]",
    "numpy",
    "scikit-learn",
    "pypdf",
    "python-multipart",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
oci = ["oci"]
ui = ["streamlit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nuevamente = ["web/*"]

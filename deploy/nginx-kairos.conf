# nginx delante de Kairos (HU-82): publica el puerto 80 y pasa todo a uvicorn en 127.0.0.1:8000.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # el límite de la app es MAX_UPLOAD_MB (10 MB); se deja un margen para el multipart
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # generar material, video o podcast con IA puede tardar varios minutos
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

name: Pruebas y revisión de secretos

on:
  push:
    branches: [main, SPRINT05]
  pull_request:
    branches: [main]

jobs:
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar llaves y archivos de credenciales
        run: python scripts/revisar_secretos.py --todos

  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar ffmpeg y voz del sistema
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"
      - name: Ejecutar pruebas
        env:
          LLM_PROVIDER: template
        run: pytest -q
